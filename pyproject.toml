[project]
name = "condor"
version = "0.1.1"
description = "Solver for computing aeroelastic responses and corresponding design derivatives."
authors = [{ name = "Ben Preston" }]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "jax>=0.9",
    "numpy>=2.4",
    "vtk>=9.6",
    "scipy>=1.17",
    "matplotlib>=3.10",
    "optax>=0.2.8",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
]

[dependency-groups]
dev = [
    "scipy-stubs>=1.17",
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
    "ipykernel>=7.3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
]

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src", "."]
testpaths = ["src/condor/tests"]
python_files = ["test*.py"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["condor"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condor"]

