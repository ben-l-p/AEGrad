[project]
name = "aegrad"
version = "0.1.0"
description = "Solver for obtaining design variable sensitivites of UVLM/nonlinear beam aeroelastic simulations."
authors = [{ name = "Ben Preston" }]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.9",
    "numpy>=2.4",
    "vtk>=9.6",
    "scipy>=1.17",
    # only needed for example scripts
    "scipy-stubs>=1.17",
    "matplotlib>=3.10",
    "optax>=0.2.8",
    # testing and linting
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src", "."]
testpaths = ["./tests"]
python_files = ["test*.py"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["aegrad"]
omit = ["models/*"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
