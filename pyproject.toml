[project]
name = "condor-jax"
version = "0.1.1"
description = "Solver for computing aeroelastic responses and corresponding design derivatives."
authors = [{ name = "Ben Preston", email = "b.preston23@imperial.ac.uk" }]
keywords = ["aeroelasticity", "unsteady vortex lattice method", "nonlinear beam", "adjoint methods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jax>=0.9",
    "numpy>=2.4",
    "vtk>=9.6",
    "scipy>=1.17",
    "matplotlib>=3.10",
]

[project.urls]
Homepage = "https://ben-l-p.github.io/condor/"
Documentation = "https://ben-l-p.github.io/condor/"
Repository = "https://github.com/ben-l-p/condor"
Issues = "https://github.com/ben-l-p/condor/issues"

[dependency-groups]
dev = [
    "scipy-stubs>=1.17",
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
]

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src", "."]
testpaths = ["src/condor/tests"]
python_files = ["test*.py"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["condor"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condor"]
exclude = ["src/condor/tests", "**/*.ipynb"]

