name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flapjax/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check version parity
        run: uv run python scripts/check_version_parity.py

      - name: Build flapjax (wheel + sdist)
        run: uv build

      - name: Build flapjax-full (wheel only)
        run: uv build --wheel packaging/full --out-dir dist

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic