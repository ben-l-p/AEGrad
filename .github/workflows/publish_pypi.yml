name: Publish to PyPI

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/python_package.yml
    permissions:
      contents: write

  publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flapjax/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check version parity
        run: uv run python .github/scripts/check_version_parity.py

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pv=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pv" ]; then
            echo "ERROR: tag $tag != pyproject.toml version $pv" >&2
            exit 1
          fi

      - name: Build flapjax (wheel + sdist)
        run: uv build

      - name: Build flapjax-full (wheel only)
        run: uv build --wheel packaging/full --out-dir dist

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic